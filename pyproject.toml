[project]
name = "repld-tool"
version = "0.4.0"
description = "Persistent Python runtime with MCP channel push. Dev shell and autonomous-agent substrate in one package."
readme = "README.md"
authors = [
    { name = "Fredrik Angelsen", email = "fredrikangelsen@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
keywords = ["repl", "mcp", "agent", "browser"]
dependencies = []

[project.scripts]
repld = "repld:main"

[project.optional-dependencies]
pretty = [
    "rich>=15.0.0",
]
browser = [
    "duckdb>=1.5.2",
    "websockets>=16.0",
    "pillow>=11.0",
]
http = [
    "httpx>=0.27",
]
all = [
    "repld-tool[pretty,browser,http]",
]

[dependency-groups]
dev = [
    "repld-tool[pretty,browser,http]",
]

[tool.uv.build-backend]
module-name = "repld"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint]
# Track ruff's default rule selection; record only the deliberate exceptions.
# BLE001/S110/S112: housekeeping paths must never raise (see CLAUDE.md) —
# broad excepts around channel pushes, sweeps, and teardown are the design.
ignore = ["BLE001", "S110", "S112"]
