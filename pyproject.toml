[project]
name = "repld-tool"
version = "0.18.0"
description = "Persistent Python runtime with MCP channel push. Dev shell and autonomous-agent substrate in one package."
readme = "README.md"
authors = [
    { name = "Fredrik Angelsen", email = "fredrikangelsen@gmail.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
keywords = ["repl", "mcp", "agent", "browser"]
dependencies = []

[project.scripts]
repld = "repld:main"

[project.optional-dependencies]
pretty = [
    "rich>=15.0.0",
]
browser = [
    "duckdb>=1.5.2",
    "websockets>=16.0",
    "pillow>=11.0",
]
http = [
    "httpx>=0.27",
]
all = [
    "repld-tool[pretty,browser,http]",
]

[dependency-groups]
dev = [
    "repld-tool[pretty,browser,http]",
]

[tool.uv.build-backend]
module-name = "repld"

[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
# ruff format reformats embedded Python code blocks in markdown by default —
# it silently collapses hand-aligned trailing comments in README/docs/site
# examples on every `ruff format` run. Exclude docs from its scope entirely.
extend-exclude = ["*.md"]
# `ruff format . gists` names gists explicitly; without this the exclude below is bypassed.
force-exclude = true

[tool.ruff.format]
# Symlinked gists are another project's files (lend, 120 columns); formatting them here
# rewrites that project's checkout. Lint still runs on them.
exclude = [
    "gists/browser_need.py",
    "gists/lendexec.py",
    "gists/liveview.py",
    "gists/partslink24_tab.py",
    "gists/proposal.py",
    "gists/served.py",
    "gists/teamviewer.py",
]

[tool.ruff.lint]
# Track ruff's default rule selection; record only the deliberate exceptions.
# BLE001/S110/S112: housekeeping paths must never raise (see CLAUDE.md) —
# broad excepts around channel pushes, sweeps, and teardown are the design.
ignore = ["BLE001", "S110", "S112"]
# Complexity ratchet: the sites flagged when it was enabled carry a `noqa`
# each and are the burn-down list; a new one is refused at lint time.
# D101-D103 hold the house style's docstring rule; depth 4 (PLR1702) is preview-only and
# `preview = true` also switches on unrelated default rules, so it runs as its own command
# (CLAUDE.md, Build & run).
extend-select = ["C901", "PLR0912", "PLR0915", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
# A phase function is one subject's assertions in order; its length is the
# subject's, and the ratchet is for the package.
"tests/**" = ["C901", "PLR0912", "PLR0915", "D101", "D102", "D103"]
"scripts/**" = ["C901", "PLR0912", "PLR0915", "D101", "D102", "D103"]
"checks/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60
